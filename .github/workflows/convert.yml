name: Convert to MLC (q4f16_1)

on:
  workflow_dispatch:

jobs:
  convert-mlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install huggingface_hub hf_transfer
          
          # MLC LLM (CPU安定版 wheel) のインストール
          # nightlyのバグを避けるため、安定して動作するインデックスからCPU版パッケージを指定
          python -m pip install --pre -U -f https://mlc.ai/wheels mlc-llm-cpu mlc-ai-cpu

      - name: Download HuggingFace Model
        env:
          HF_HUB_ENABLE_HF_TRANSFER: 1
        run: |
          huggingface-cli download WebAIPocket/Serow-Qwen2.5-0.5B-Instruct --local-dir ./model

      - name: Convert & Quantize to MLC (q4f16_1)
        run: |
          # MLC LLM 変換・量子化の実行
          # 1. コンフィグファイルの生成
          python -m mlc_llm gen_config ./model \
            --quantization q4f16_1 \
            --conv-template qwen2 \
            -o ./mlc_model

          # 2. 重みの変換と量子化
          python -m mlc_llm convert_weight ./model \
            --quantization q4f16_1 \
            -o ./mlc_model

      - name: Create HF repo if not exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli repo create WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-MLC-q4f16_1 \
            --repo-type model --exist-ok --token $HF_TOKEN

      - name: Upload to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload \
            WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-MLC-q4f16_1 \
            ./mlc_model \
            --repo-type model \
            --token $HF_TOKEN
