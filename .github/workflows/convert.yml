name: Convert to MLC (q4f16_1)

on:
  workflow_dispatch:

jobs:
  convert-mlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install huggingface_hub
          
          # MLC LLM (CPU安定版) のインストール
          python -m pip install --pre -U -f https://mlc.ai/wheels mlc-llm-cpu mlc-ai-cpu

      - name: Download HuggingFace Model
        env:
          HF_XET_HIGH_PERFORMANCE: 1
        run: |
          # huggingface-cli の代わりに新しい 'hf' コマンドを使用
          hf download WebAIPocket/Serow-Qwen2.5-0.5B-Instruct --local-dir ./model

      - name: Convert & Quantize to MLC (q4f16_1)
        run: |
          # 1. コンフィグファイルの生成
          python -m mlc_llm gen_config ./model \
            --quantization q4f16_1 \
            --conv-template qwen2 \
            -o ./mlc_model

          # 2. 重みの変換と量子化
          python -m mlc_llm convert_weight ./model \
            --quantization q4f16_1 \
            -o ./mlc_model

      - name: Create HF repo if not exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # リポジトリ作成（hf 形式）
          hf repos create WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-MLC-q4f16_1 \
            --type model --exist-ok --token $HF_TOKEN

      - name: Upload to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # アップロード（hf 形式）
          hf upload \
            WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-MLC-q4f16_1 \
            ./mlc_model \
            . \
            --type model \
            --token $HF_TOKEN
