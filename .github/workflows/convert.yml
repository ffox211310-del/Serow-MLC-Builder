name: Convert to MLC

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MLC-LLM
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre -U -f https://mlc.ai/wheels mlc-llm-nightly-cpu mlc-ai-nightly-cpu
          python -m pip install huggingface_hub hf_transfer

      - name: Download Serow model
        env:
          HF_HUB_ENABLE_HF_TRANSFER: 1
        run: |
          hf download WebAIPocket/Serow-Qwen2.5-0.5B-Instruct --local-dir ./model

      - name: Create MLC repo if not exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf repo create WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-q4f16_1-MLC --repo-type model --exist-ok --token $HF_TOKEN

      - name: Convert to MLC (q4f16_1)
        run: |
          python -m mlc_llm gen_config ./model --quantization q4f16_1 --conv-template qwen2 -o ./dist
          python -m mlc_llm convert_weight ./model --quantization q4f16_1 -o ./dist
          ls -lh ./dist

      - name: Upload to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-q4f16_1-MLC ./dist --repo-type model --token $HF_TOKEN
