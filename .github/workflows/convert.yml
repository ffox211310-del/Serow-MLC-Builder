name: Convert to ONNX

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ONNX変換に必要なライブラリをインストール
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install huggingface_hub hf_transfer
          # OptimumとONNXRuntimeをインストール
          python -m pip install optimum[onnxruntime] transformers

      - name: Download Serow model
        env:
          HF_HUB_ENABLE_HF_TRANSFER: 1
        run: |
          huggingface-cli download WebAIPocket/Serow-Qwen2.5-0.5B-Instruct --local-dir ./model

      - name: Convert to ONNX with Optimum
        run: |
          # モデルをONNXにエクスポート
          optimum-cli export onnx \
            --model ./model \
            --task text-generation \
            --opset 18 \
            --trust-remote-code \
            --dtype float16 \
            ./onnx_model

      - name: Create HF repo if not exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli repo create WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-ONNX \
            --repo-type model --exist-ok --token $HF_TOKEN

      - name: Upload to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload \
            WebAIPocket/Serow-Qwen2.5-0.5B-Instruct-ONNX \
            ./onnx_model \
            --repo-type model \
            --token $HF_TOKEN
